<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Handover</title>
<style>
:root{
  --blue:#0a84ff;
  --ink:#f5f5f7;
  --ink-dim:rgba(245,245,247,.58);
  --ink-faint:rgba(245,245,247,.34);
  --glass:rgba(255,255,255,.055);
  --glass-hi:rgba(255,255,255,.10);
  --edge:rgba(255,255,255,.13);
  --edge-soft:rgba(255,255,255,.07);
  --shadow:0 18px 50px rgba(0,0,0,.45);
  --r-lg:22px; --r-md:15px; --r-sm:10px;
  --blur:saturate(180%) blur(30px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:light){
  :root{
    --ink:#12131a; --ink-dim:rgba(18,19,26,.6); --ink-faint:rgba(18,19,26,.36);
    --glass:rgba(255,255,255,.5); --glass-hi:rgba(255,255,255,.72);
    --edge:rgba(255,255,255,.85); --edge-soft:rgba(18,19,26,.07);
    --shadow:0 18px 50px rgba(31,37,89,.16);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);color:var(--ink);font-size:14px;
  -webkit-font-smoothing:antialiased;overflow:hidden;
  background:#0b0d14;
}
@media (prefers-color-scheme:light){ body{background:#eef0f8} }

/* ambientní podklad — dává sklu co rozostřovat */
#wash{position:fixed;inset:-20%;z-index:-1;filter:blur(40px);
  background:
    radial-gradient(48% 46% at 18% 14%, #3b2c93 0%, transparent 62%),
    radial-gradient(42% 44% at 84% 8%,  #0f5f8f 0%, transparent 60%),
    radial-gradient(52% 50% at 72% 88%, #7a2b6b 0%, transparent 62%),
    radial-gradient(40% 40% at 10% 86%, #10606b 0%, transparent 60%);
}
@media (prefers-color-scheme:light){
  #wash{background:
    radial-gradient(48% 46% at 18% 14%, #b9c4ff 0%, transparent 62%),
    radial-gradient(42% 44% at 84% 8%,  #a8e4ff 0%, transparent 60%),
    radial-gradient(52% 50% at 72% 88%, #ffc3e6 0%, transparent 62%),
    radial-gradient(40% 40% at 10% 86%, #b6f0e6 0%, transparent 60%);}
}

.glass{
  background:var(--glass);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--edge-soft);
  box-shadow:var(--shadow), inset 0 1px 0 var(--edge);
}

button,input,textarea{font:inherit;color:inherit;background:none;border:none}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(140,140,160,.35);border-radius:10px;border:3px solid transparent;background-clip:content-box}

/* ── shell ───────────────────────────────────────────── */
#shell{height:100%;display:grid;grid-template-columns:236px 1fr;gap:12px;padding:12px;
  padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom))}

/* ── sidebar ─────────────────────────────────────────── */
#side{border-radius:var(--r-lg);display:flex;flex-direction:column;overflow:hidden}
#brand{padding:18px 18px 12px;display:flex;align-items:center;gap:9px}
#brand b{font-size:16px;font-weight:600;letter-spacing:-.01em}
#brand .dot{width:9px;height:9px;border-radius:50%;background:var(--blue);
  box-shadow:0 0 12px var(--blue)}
#tree{flex:1;overflow-y:auto;padding:4px 10px 10px;display:flex;flex-direction:column;gap:1px}
.node{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r-sm);
  color:var(--ink-dim);width:100%;text-align:left;font-size:13.5px;transition:background .14s}
.node:hover{background:var(--glass-hi);color:var(--ink)}
.node.on{background:var(--blue);color:#fff}
.node .tw{width:14px;text-align:center;font-size:9px;opacity:.6;flex:none}
.node .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node.drop{outline:2px dashed var(--blue);outline-offset:-2px}
#disk{padding:12px 16px;border-top:1px solid var(--edge-soft);font-size:11.5px;color:var(--ink-faint)}
#bar{height:4px;border-radius:4px;background:rgba(128,128,150,.28);margin-top:7px;overflow:hidden}
#bar i{display:block;height:100%;background:var(--blue);border-radius:4px}

/* ── main ────────────────────────────────────────────── */
#main{border-radius:var(--r-lg);display:flex;flex-direction:column;overflow:hidden;position:relative}
#top{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--edge-soft);flex:none}
.icobtn{width:31px;height:31px;border-radius:9px;display:grid;place-items:center;color:var(--ink-dim);flex:none;transition:.14s}
.icobtn:hover{background:var(--glass-hi);color:var(--ink)}
.icobtn:disabled{opacity:.3;cursor:default;background:none}
#crumbs{flex:1;display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
#crumbs::-webkit-scrollbar{display:none}
.crumb{padding:4px 8px;border-radius:8px;color:var(--ink-dim);white-space:nowrap;font-size:13.5px;transition:.14s}
.crumb:hover{background:var(--glass-hi);color:var(--ink)}
.crumb.last{color:var(--ink);font-weight:590}
.sep{color:var(--ink-faint);font-size:11px;flex:none}
#find{display:flex;align-items:center;gap:6px;background:var(--glass-hi);border-radius:9px;padding:5px 10px;width:180px;flex:none}
#find input{width:100%;font-size:13px}
#find input::placeholder{color:var(--ink-faint)}
@media (max-width:900px){#find{width:44px}#find input{display:none}}

#stage{flex:1;overflow-y:auto;padding:16px;position:relative}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
#grid.rows{grid-template-columns:1fr;gap:1px}

.item{border-radius:var(--r-md);padding:12px 6px;display:flex;flex-direction:column;align-items:center;
  gap:8px;text-align:center;position:relative;transition:background .14s,transform .14s;user-select:none}
.item:hover{background:var(--glass-hi)}
.item.sel{background:var(--blue);color:#fff}
.item.sel .meta{color:rgba(255,255,255,.75)}
.item.drop{outline:2px dashed var(--blue);outline-offset:-3px}
.item:active{transform:scale(.97)}
.thumb{width:56px;height:56px;display:grid;place-items:center;flex:none;position:relative}
.thumb svg{width:44px;height:44px}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:8px;
  box-shadow:0 4px 14px rgba(0,0,0,.3)}
.nm2{font-size:12.5px;line-height:1.3;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:11px;color:var(--ink-faint)}

/* řádkové zobrazení */
#grid.rows .item{flex-direction:row;text-align:left;padding:8px 12px;gap:12px;border-radius:var(--r-sm)}
#grid.rows .thumb{width:26px;height:26px}
#grid.rows .thumb svg{width:24px;height:24px}
#grid.rows .nm2{flex:1;-webkit-line-clamp:1;font-size:13.5px}
#grid.rows .meta{flex:none;font-variant-numeric:tabular-nums}

#empty{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:8px;
  color:var(--ink-faint);pointer-events:none;text-align:center;padding:24px}
#empty b{color:var(--ink-dim);font-weight:590;font-size:15px}

/* ── drop overlay ────────────────────────────────────── */
#drop{position:absolute;inset:10px;border-radius:var(--r-md);border:2px dashed var(--blue);
  background:rgba(10,132,255,.12);display:grid;place-items:center;font-weight:590;
  color:var(--ink);pointer-events:none;opacity:0;transition:opacity .16s;z-index:5}
#drop.on{opacity:1}

/* ── kontextové menu ─────────────────────────────────── */
#menu{position:fixed;z-index:60;min-width:184px;border-radius:13px;padding:5px;display:none;
  flex-direction:column;gap:1px}
#menu.on{display:flex}
#menu button{padding:8px 11px;border-radius:8px;text-align:left;font-size:13.5px;display:flex;
  align-items:center;gap:9px;transition:.1s}
#menu button:hover{background:var(--blue);color:#fff}
#menu button.warn{color:#ff6b6b}
#menu button.warn:hover{background:#e03131;color:#fff}
#menu hr{border:none;border-top:1px solid var(--edge-soft);margin:4px 6px}

/* ── náhled ──────────────────────────────────────────── */
#peek{position:fixed;inset:0;z-index:80;display:none;place-items:center;padding:24px;
  background:rgba(6,7,12,.55);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
#peek.on{display:grid}
#peekbox{max-width:min(1080px,94vw);max-height:90vh;border-radius:var(--r-lg);overflow:hidden;
  display:flex;flex-direction:column;animation:pop .22s cubic-bezier(.2,.9,.3,1.1)}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
#peekhead{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--edge-soft);flex:none}
#peekhead .nm{flex:1;font-weight:590;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#peekbody{overflow:auto;padding:0;display:grid;place-items:center;min-height:120px}
#peekbody img,#peekbody video{max-width:100%;max-height:74vh;display:block}
#peekbody iframe{width:min(900px,90vw);height:74vh;border:none;background:#fff}
#peekbody pre{font-family:var(--mono);font-size:12.5px;line-height:1.6;padding:20px;
  white-space:pre-wrap;word-break:break-word;width:100%;max-height:74vh;overflow:auto}
#peekbody audio{margin:40px}

/* ── toast ───────────────────────────────────────────── */
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);z-index:90;
  padding:11px 18px;border-radius:13px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ── postup nahrávání ────────────────────────────────── */
#prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:transparent;z-index:6}
#prog i{display:block;height:100%;width:0;background:var(--blue);transition:width .2s}

@media (max-width:760px){
  #shell{grid-template-columns:1fr;padding:8px;gap:8px}
  #side{display:none}
  #side.open{display:flex;position:fixed;inset:8px auto 8px 8px;width:250px;z-index:70}
  #grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%20180%20180%22><defs><linearGradient%20id=%22g%22%20x1=%220%22%20y1=%220%22%20x2=%220%22%20y2=%221%22><stop%20offset=%220%22%20stop-color=%22%230f1a2c%22/><stop%20offset=%221%22%20stop-color=%22%23070b13%22/></linearGradient></defs><rect%20width=%22180%22%20height=%22180%22%20fill=%22url%28%23g%29%22/><path%20d=%22M34%2062a10%2010%200%200110-10h28l13%2015h51a10%2010%200%200110%2010v51a10%2010%200%2001-10%2010H44a10%2010%200%2001-10-10z%22%20fill=%22none%22%20stroke=%22%230a84ff%22%20stroke-width=%2211%22%20stroke-linejoin=%22round%22/><path%20d=%22M62%2096h56%22%20stroke=%22%230a84ff%22%20stroke-width=%2211%22%20stroke-linecap=%22round%22/><path%20d=%22M62%20118h34%22%20stroke=%22%230a84ff%22%20stroke-width=%2211%22%20stroke-linecap=%22round%22%20opacity=%22.55%22/></svg>">
<meta name="apple-mobile-web-app-title" content="Handover">
</head>
<body>
<div id="wash"></div>

<div id="shell">
  <aside id="side" class="glass">
    <div id="brand"><span class="dot"></span><b>Handover</b></div>
    <nav id="tree"></nav>
    <div id="disk">volné místo <span id="dfree">—</span><div id="bar"><i></i></div></div>
  </aside>

  <section id="main" class="glass">
    <header id="top">
      <button class="icobtn" id="burger" title="Složky">☰</button>
      <button class="icobtn" id="up" title="O úroveň výš">↑</button>
      <div id="crumbs"></div>
      <div id="find"><span style="opacity:.5">⌕</span><input id="q" type="search" placeholder="Hledat" autocomplete="off"></div>
      <button class="icobtn" id="view" title="Přepnout zobrazení">▤</button>
      <button class="icobtn" id="newdir" title="Nová složka">＋</button>
      <button class="icobtn" id="add" title="Nahrát soubory">↥</button>
    </header>

    <div id="stage">
      <div id="grid"></div>
      <div id="empty" hidden></div>
      <div id="drop">Pusť to sem</div>
    </div>
    <div id="prog"><i></i></div>
  </section>
</div>

<div id="menu" class="glass"></div>

<div id="peek">
  <div id="peekbox" class="glass">
    <div id="peekhead">
      <span class="nm"></span>
      <a class="icobtn" id="pkdl" title="Stáhnout" download>↓</a>
      <button class="icobtn" id="pkclose" title="Zavřít">✕</button>
    </div>
    <div id="peekbody"></div>
  </div>
</div>

<div id="toast" class="glass"></div>
<input type="file" id="picker" multiple hidden>

<script>
const $ = s => document.querySelector(s);

/* Appka může běžet na kořeni i pod podcestou (tailscale serve --set-path).
   Odvodíme prefix z adresy stránky, ať volání míří kam mají. */
const BASE = location.pathname.replace(/\/index\.html$/, '').replace(/\/+$/, '');
const fileUrl = rel => BASE + '/f/' + encodeURI(rel);

const api = (p, o) => fetch(BASE + p, o).then(async r => {
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
});

let cwd = '', entries = [], sel = new Set(), rows = localStorage.rows === '1', readonly = false;
const hist = { back: [], fwd: [] };

/* ── ikony ───────────────────────────────────────────── */
const P = {
  folder: '<path d="M4 9a3 3 0 013-3h9.2a3 3 0 012.4 1.2L20 9h21a3 3 0 013 3v27a3 3 0 01-3 3H7a3 3 0 01-3-3z"/>',
  file:   '<path d="M11 5a3 3 0 013-3h14l12 12v29a3 3 0 01-3 3H14a3 3 0 01-3-3z" opacity=".9"/><path d="M28 2l12 12H31a3 3 0 01-3-3z" opacity=".55"/>',
  img:    '<path d="M5 10a4 4 0 014-4h30a4 4 0 014 4v28a4 4 0 01-4 4H9a4 4 0 01-4-4z" opacity=".9"/><circle cx="17" cy="18" r="4" fill="#fff" opacity=".85"/><path d="M5 33l11-10 8 7 7-6 12 11v3a4 4 0 01-4 4H9a4 4 0 01-4-4z" fill="#fff" opacity=".6"/>',
  av:     '<path d="M5 10a4 4 0 014-4h30a4 4 0 014 4v28a4 4 0 01-4 4H9a4 4 0 01-4-4z" opacity=".9"/><path d="M20 17l12 7-12 7z" fill="#fff" opacity=".9"/>',
  txt:    '<path d="M11 5a3 3 0 013-3h14l12 12v29a3 3 0 01-3 3H14a3 3 0 01-3-3z" opacity=".9"/><g fill="#fff" opacity=".75"><rect x="17" y="22" width="20" height="2.4" rx="1.2"/><rect x="17" y="29" width="20" height="2.4" rx="1.2"/><rect x="17" y="36" width="13" height="2.4" rx="1.2"/></g>',
  zip:    '<path d="M11 5a3 3 0 013-3h14l12 12v29a3 3 0 01-3 3H14a3 3 0 01-3-3z" opacity=".9"/><rect x="24" y="6" width="4" height="26" fill="#fff" opacity=".7"/><rect x="21" y="32" width="10" height="9" rx="2" fill="#fff" opacity=".85"/>'
};
const TINT = { folder:'#4aa3ff', img:'#ff9f4a', av:'#c96bff', txt:'#8e97a8', zip:'#ffd23f', file:'#7d8797' };

function kindOf(e){
  if (e.dir) return 'folder';
  const m = e.mime || '', n = e.name.toLowerCase();
  if (m.startsWith('image/')) return 'img';
  if (m.startsWith('video/') || m.startsWith('audio/')) return 'av';
  if (m.startsWith('text/') || /\.(txt|md|log|json|ya?ml|csv|conf|sh|py|js|html|css)$/.test(n)) return 'txt';
  if (/\.(zip|rar|7z|tar|gz|xz|bz2)$/.test(n)) return 'zip';
  return 'file';
}
const icon = k => `<svg viewBox="0 0 48 48" fill="${TINT[k]}">${P[k]}</svg>`;

const fmtSize = b => b == null ? '' :
  b < 1024 ? b + ' B' :
  b < 1048576 ? (b/1024).toFixed(0) + ' kB' :
  b < 1073741824 ? (b/1048576).toFixed(1) + ' MB' : (b/1073741824).toFixed(2) + ' GB';

function fmtDate(t){
  const d = new Date(t*1000), now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  return sameDay ? d.toLocaleTimeString('cs', {hour:'2-digit', minute:'2-digit'})
                 : d.toLocaleDateString('cs', {day:'numeric', month:'numeric', year:'2-digit'});
}

/* clipboard API je jen v secure contextu (HTTPS / localhost) — přes http:// fallback */
function copyText(text){
  if (navigator.clipboard && isSecureContext) return navigator.clipboard.writeText(text);
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy') } finally { ta.remove() }
}

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2400);
}

/* ── načtení a vykreslení ────────────────────────────── */
async function go(path, push = true){
  try{
    const d = await api('/api/list?path=' + encodeURIComponent(path));
    if (push && cwd !== d.path){ hist.back.push(cwd); hist.fwd.length = 0; }
    cwd = d.path; entries = d.entries; sel.clear();
    $('#q').value = '';
    crumbs(d.crumbs); draw(); loadTree();
    $('#up').disabled = !cwd;
  } catch(e){ toast(e.message) }
}

function crumbs(list){
  const c = $('#crumbs'); c.innerHTML = '';
  const mk = (name, path, last) => {
    const b = document.createElement('button');
    b.className = 'crumb' + (last ? ' last' : ''); b.textContent = name;
    b.onclick = () => go(path);
    b.ondragover = ev => ev.preventDefault();
    b.ondrop = ev => { ev.preventDefault(); dropMove(path) };
    c.appendChild(b);
  };
  mk('Handover', '', !list.length);
  list.forEach((cr, i) => {
    const s = document.createElement('span'); s.className = 'sep'; s.textContent = '›';
    c.appendChild(s);
    mk(cr.name, cr.path, i === list.length - 1);
  });
  c.scrollLeft = 9999;
}

function draw(list = entries){
  const g = $('#grid'); g.className = rows ? 'rows' : '';
  g.innerHTML = '';
  $('#empty').hidden = list.length > 0;
  if (!list.length){
    $('#empty').innerHTML = $('#q').value
      ? '<b>Nic se nenašlo</b><span>Zkus jiný výraz.</span>'
      : '<b>Prázdná složka</b><span>Přetáhni sem soubory nebo je vyber tlačítkem ↥.</span>';
  }
  for (const e of list){
    const k = kindOf(e);
    const d = document.createElement('div');
    d.className = 'item' + (sel.has(e.path) ? ' sel' : '');
    d.tabIndex = 0; d.draggable = !readonly;
    const thumb = (k === 'img' && e.size < 12e6)
      ? `<img loading="lazy" src="${fileUrl(e.path)}" alt="">`
      : icon(k);
    d.innerHTML = `<div class="thumb">${thumb}</div><div class="nm2">${esc(e.name)}</div>` +
                  `<div class="meta">${e.dir ? 'složka' : fmtSize(e.size)}${rows ? ' · ' + fmtDate(e.modified) : ''}</div>`;

    d.onclick = ev => {
      if (ev.metaKey || ev.ctrlKey) sel.has(e.path) ? sel.delete(e.path) : sel.add(e.path);
      else { sel.clear(); sel.add(e.path) }
      draw(list);
    };
    d.ondblclick = () => open(e);
    d.oncontextmenu = ev => { ev.preventDefault(); if (!sel.has(e.path)){ sel.clear(); sel.add(e.path); draw(list) } menu(ev, e) };
    d.ondragstart = ev => { if (!sel.has(e.path)){ sel.clear(); sel.add(e.path); draw(list) }
                            ev.dataTransfer.setData('text/plain', 'move') };
    if (e.dir){
      d.ondragover = ev => { ev.preventDefault(); d.classList.add('drop') };
      d.ondragleave = () => d.classList.remove('drop');
      d.ondrop = ev => { ev.preventDefault(); d.classList.remove('drop');
                         ev.dataTransfer.files.length ? upload(ev.dataTransfer.files, e.path) : dropMove(e.path) };
    }
    g.appendChild(d);
  }
}
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ── otevření / náhled ───────────────────────────────── */
async function open(e){
  if (e.dir) return go(e.path);
  const k = kindOf(e), url = fileUrl(e.path);
  const body = $('#peekbody'); body.innerHTML = '';
  $('#peekhead .nm').textContent = e.name;
  $('#pkdl').href = url + '?dl=1';
  if (k === 'img') body.innerHTML = `<img src="${url}" alt="">`;
  else if ((e.mime||'').startsWith('video/')) body.innerHTML = `<video src="${url}" controls autoplay></video>`;
  else if ((e.mime||'').startsWith('audio/')) body.innerHTML = `<audio src="${url}" controls autoplay></audio>`;
  else if (e.mime === 'application/pdf') body.innerHTML = `<iframe src="${url}"></iframe>`;
  else if (k === 'txt'){
    try{ const t = await api('/api/text/' + encodeURI(e.path));
         body.innerHTML = '<pre></pre>'; body.querySelector('pre').textContent = t.content }
    catch{ return location.href = url + '?dl=1' }
  } else return location.href = url + '?dl=1';
  $('#peek').classList.add('on');
}
const closePeek = () => { $('#peek').classList.remove('on'); $('#peekbody').innerHTML = '' };
$('#pkclose').onclick = closePeek;
$('#peek').onclick = ev => { if (ev.target.id === 'peek') closePeek() };

/* ── kontextové menu ─────────────────────────────────── */
function menu(ev, e){
  const m = $('#menu'), items = [];
  if (!e.dir) items.push(['Otevřít náhled', () => open(e)], ['Stáhnout', () => location.href = fileUrl(e.path) + '?dl=1']);
  else items.push(['Otevřít', () => go(e.path)], ['Spočítat velikost', async () => {
    try{ toast('Počítám…'); const r = await api('/api/du?path=' + encodeURIComponent(e.path)); toast(e.name + ' — ' + fmtSize(r.size)) }
    catch(x){ toast(x.message) }
  }]);
  items.push(['Kopírovat odkaz', () => { copyText(location.origin + fileUrl(e.path)); toast('Odkaz zkopírován') }]);
  if (!readonly) items.push(null, ['Přejmenovat', () => rename(e)], ['Smazat', () => del(), 'warn']);

  m.innerHTML = '';
  for (const it of items){
    if (!it){ m.appendChild(document.createElement('hr')); continue }
    const b = document.createElement('button');
    b.textContent = it[0]; if (it[2]) b.className = it[2];
    b.onclick = () => { m.classList.remove('on'); it[1]() };
    m.appendChild(b);
  }
  m.classList.add('on');
  const w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.min(ev.clientX, innerWidth - w - 10) + 'px';
  m.style.top  = Math.min(ev.clientY, innerHeight - h - 10) + 'px';
}
addEventListener('click', () => $('#menu').classList.remove('on'));
addEventListener('scroll', () => $('#menu').classList.remove('on'), true);

/* ── operace ─────────────────────────────────────────── */
async function rename(e){
  const name = prompt('Nový název', e.name);
  if (!name || name === e.name) return;
  try{ await api('/api/rename', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ path: e.path, name }) }); go(cwd, false) }
  catch(x){ toast(x.message) }
}

async function del(){
  const paths = [...sel]; if (!paths.length) return;
  const what = paths.length === 1 ? entries.find(e => e.path === paths[0])?.name : paths.length + ' položek';
  if (!confirm('Smazat ' + what + '? Zpět to nejde.')) return;
  try{ await api('/api/delete', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ paths }) }); toast('Smazáno'); go(cwd, false) }
  catch(x){ toast(x.message) }
}

async function dropMove(dest){
  const paths = [...sel]; if (!paths.length) return;
  try{ await api('/api/move', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ paths, dest }) }); toast('Přesunuto'); go(cwd, false) }
  catch(x){ toast(x.message) }
}

function upload(files, dest = cwd){
  if (readonly) return toast('Složka je jen pro čtení');
  if (!files.length) return;
  const fd = new FormData();
  for (const f of files) fd.append('files', f, f.webkitRelativePath || f.name);
  fd.append('path', dest);
  const xhr = new XMLHttpRequest(), bar = $('#prog i');
  xhr.upload.onprogress = ev => { if (ev.lengthComputable) bar.style.width = (ev.loaded/ev.total*100) + '%' };
  xhr.onload = () => { bar.style.width = '0';
    if (xhr.status < 300){ toast(files.length + (files.length === 1 ? ' soubor nahrán' : ' souborů nahráno')); go(cwd, false); diskInfo() }
    else toast('Nahrání selhalo') };
  xhr.onerror = () => { bar.style.width = '0'; toast('Nahrání selhalo') };
  xhr.open('POST', BASE + '/api/upload'); xhr.send(fd);
}

/* ── postranní strom ─────────────────────────────────── */
const openDirs = new Set(JSON.parse(localStorage.openDirs || '[]'));
async function loadTree(){
  const nav = $('#tree'); nav.innerHTML = '';
  const root = document.createElement('button');
  root.className = 'node' + (cwd === '' ? ' on' : '');
  root.innerHTML = '<span class="tw"></span><span class="nm">Handover</span>';
  root.onclick = () => go('');
  root.ondragover = ev => { ev.preventDefault(); root.classList.add('drop') };
  root.ondragleave = () => root.classList.remove('drop');
  root.ondrop = ev => { ev.preventDefault(); root.classList.remove('drop'); dropMove('') };
  nav.appendChild(root);
  await branch('', nav, 0);
}
async function branch(path, host, level){
  let kids = [];
  try{ kids = await api('/api/tree?path=' + encodeURIComponent(path)) } catch{ return }
  for (const k of kids){
    const b = document.createElement('button');
    const isOpen = openDirs.has(k.path);
    b.className = 'node' + (cwd === k.path ? ' on' : '');
    b.style.paddingLeft = (10 + level * 13) + 'px';
    b.innerHTML = `<span class="tw">${isOpen ? '▾' : '▸'}</span><span class="nm">${esc(k.name)}</span>`;
    b.onclick = ev => {
      if (ev.offsetX < 22 + level * 13){
        isOpen ? openDirs.delete(k.path) : openDirs.add(k.path);
        localStorage.openDirs = JSON.stringify([...openDirs]); loadTree();
      } else go(k.path);
    };
    b.ondragover = ev => { ev.preventDefault(); b.classList.add('drop') };
    b.ondragleave = () => b.classList.remove('drop');
    b.ondrop = ev => { ev.preventDefault(); b.classList.remove('drop'); dropMove(k.path) };
    host.appendChild(b);
    if (isOpen) await branch(k.path, host, level + 1);
  }
}

async function diskInfo(){
  try{
    const c = await api('/api/config');
    readonly = c.readonly;
    $('#dfree').textContent = fmtSize(c.disk.free);
    $('#bar i').style.width = (100 - c.disk.free / c.disk.total * 100) + '%';
    if (readonly) ['#newdir','#add'].forEach(s => $(s).disabled = true);
  } catch{}
}

/* ── ovládání ────────────────────────────────────────── */
$('#up').onclick = () => go(cwd.includes('/') ? cwd.slice(0, cwd.lastIndexOf('/')) : '');
$('#view').onclick = () => { rows = !rows; localStorage.rows = rows ? '1' : '0'; draw() };
$('#add').onclick = () => $('#picker').click();
$('#picker').onchange = ev => { upload(ev.target.files); ev.target.value = '' };
$('#burger').onclick = () => $('#side').classList.toggle('open');
$('#newdir').onclick = async () => {
  const name = prompt('Název nové složky');
  if (!name) return;
  try{ await api('/api/mkdir', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ path: cwd, name }) }); go(cwd, false) }
  catch(x){ toast(x.message) }
};

let qt;
$('#q').oninput = ev => {
  clearTimeout(qt);
  const v = ev.target.value.trim();
  qt = setTimeout(async () => {
    if (v.length < 2) return draw();
    try{ const r = await api(`/api/search?q=${encodeURIComponent(v)}&path=${encodeURIComponent(cwd)}`);
         draw(r.entries) } catch{}
  }, 220);
};

/* drop na celé okno */
let dragDepth = 0;
addEventListener('dragenter', ev => { if (ev.dataTransfer.types.includes('Files')){ dragDepth++; $('#drop').classList.add('on') } });
addEventListener('dragleave', () => { if (--dragDepth <= 0){ dragDepth = 0; $('#drop').classList.remove('on') } });
addEventListener('dragover', ev => ev.preventDefault());
addEventListener('drop', ev => {
  ev.preventDefault(); dragDepth = 0; $('#drop').classList.remove('on');
  if (ev.dataTransfer.files.length) upload(ev.dataTransfer.files);
});

/* vložení ze schránky */
addEventListener('paste', ev => {
  const files = [...ev.clipboardData.files];
  if (files.length) return upload(files);
  const text = ev.clipboardData.getData('text').trim();
  if (!text || readonly || document.activeElement.tagName === 'INPUT') return;
  const name = prompt('Uložit vložený text jako', 'poznámka.txt');
  if (!name) return;
  api('/api/textfile', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ path: cwd, name, content: text }) })
    .then(() => { toast('Uloženo'); go(cwd, false) }).catch(x => toast(x.message));
});

addEventListener('keydown', ev => {
  if (ev.key === 'Escape'){ closePeek(); $('#menu').classList.remove('on') }
  if (document.activeElement.tagName === 'INPUT') return;
  if (ev.key === 'Backspace'){ ev.preventDefault(); $('#up').click() }
  if ((ev.key === 'Delete' || (ev.key === 'Backspace' && ev.metaKey)) && sel.size) del();
  if (ev.key === 'Enter' && sel.size === 1) open(entries.find(e => e.path === [...sel][0]));
  if ((ev.metaKey || ev.ctrlKey) && ev.key === 'a'){ ev.preventDefault(); entries.forEach(e => sel.add(e.path)); draw() }
  if ((ev.metaKey || ev.ctrlKey) && ev.key === 'f'){ ev.preventDefault(); $('#q').focus() }
});

$('#stage').onclick = ev => { if (ev.target.id === 'stage' || ev.target.id === 'grid'){ sel.clear(); draw() } };

diskInfo(); go('');
</script>
</body>
